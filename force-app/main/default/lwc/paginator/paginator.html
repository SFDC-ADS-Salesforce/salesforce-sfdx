<template>
    <lightning-layout class="slds-p-around_small">
        <!-- MOSTRAR ITENS POR PÁGINA RÓTULO -->
        <lightning-layout-item size="1" class="slds-m-top_small">
            Itens por página:
        </lightning-layout-item>

        <!-- MOSTRAR ITENS POR PÁGINA DROPDOWN -->
        <lightning-layout-item size="1" class="slds-m-top_x-small">
            <lightning-combobox options={getItemsPerPage} variant="label-hidden" value={pageSize}
                onchange={handlePageSizeChange}></lightning-combobox>
        </lightning-layout-item>
        <lightning-layout-item size="2"></lightning-layout-item>

        <!-- MOSTRAR TOTAL DE REGISTROS -->
        <lightning-layout-item size="4" class="slds-align_absolute-center">
            {recordsFrom} – {recordsTo} de {totalRecords}
        </lightning-layout-item> 

        <!-- MOSTRAR BOTÕES DE NAVEGAÇÃO -->
        <lightning-layout-item size="4" class="slds-text-align_right">
            <button onclick={goToFirstPageHandler} lwc:if={isClientSidePagination} title="Vá para o primeiro" class={previousButtonsStyle}>
                <lightning-icon icon-name="utility:jump_to_left" class="icon-custom" ></lightning-icon>
            </button>

            <button onclick={previousPageHandler} title="Página anterior" class={previousButtonsStyle}>
                <lightning-icon icon-name="utility:chevronleft" ></lightning-icon>
            </button>
            

            <select class="page-selector" onchange={goToPageHandler} lwc:if={isClientSidePagination}>
                <template for:each={pageNumbersForPicklist} for:item="option">
                    <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                </template>
            </select>

            <span lwc:else class="m-15">
                <strong title="Current page number">{pageNumber}</strong> of
                <span title="Total pages"> {totalPages}</span>
            </span>

            <button onclick={nextPageHandler} title="Proxima pagina" class={nextButtonsStyle}>
                <lightning-icon icon-name="utility:chevronright"></lightning-icon>
            </button>

            <button onclick={goToLastPageHandler} title="Vá para ultima" lwc:if={isClientSidePagination} class={nextButtonsStyle}>
                <lightning-icon icon-name="utility:jump_to_right"></lightning-icon>
            </button>

        </lightning-layout-item>
    </lightning-layout>
</template>
